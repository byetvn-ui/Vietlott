name: Cập nhật kết quả

on:
  schedule:
    - cron: "*/10 11-13 * * 0,2-6"
    - cron: "30 2,15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lấy kết quả mới
        id: sync
        continue-on-error: true
        run: python3 server.py --sync-once
      - name: Lưu thay đổi
        run: |
          git config user.name "vietlott-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Cập nhật kết quả $(date -u +%F)" && git push)
      - name: Báo lỗi nếu thất bại
        if: steps.sync.outcome == 'failure'
        run: exit 1
