name: Cập nhật kết quả

on:
  schedule:
    # Giờ UTC (VN = UTC+7), chọn phút lẻ để tránh giờ cao điểm của GitHub. Bỏ thứ Hai (không có kỳ quay).
    - cron: "47 10 * * 0,2-6"   # 17:47 VN - bắt đầu chờ
    - cron: "27 11 * * 0,2-6"   # 18:27 VN
    - cron: "57 11 * * 0,2-6"   # 18:57 VN
    - cron: "37 12 * * 0,2-6"   # 19:37 VN
    - cron: "17 13 * * 0,2-6"   # 20:17 VN
    - cron: "41 2,15 * * *"     # 09:41 và 22:41 VN - kiểm tra bù
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 160
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm tra bản parse
        if: hashFiles('tests/**') != ''
        run: python3 -m unittest discover -s tests
      - name: Lấy kết quả (chờ tới khi kỳ hôm nay có kết quả)
        run: python3 server.py --watch
      - name: Lưu thay đổi còn sót (nếu có)
        if: always()
        run: |
          git config user.name "vietlott-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Cập nhật kết quả $(date -u +%F)" && git push origin HEAD)
